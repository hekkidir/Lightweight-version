services:
  screener:
    image: serdardursun/stock-analysis:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"   # localhost only; host :8000 is tw-screener's
    volumes:
      - /opt/stock-analysis/data:/app/data
      - /opt/stock-analysis/static-export:/app/static-export
    environment:
      SCREENER_HOST: "0.0.0.0"
      SCREENER_PORT: "8000"
      SCREENER_DATA_DIR: "/app/data"
      SCREENER_LOG_LEVEL: "INFO"
      SCREENER_CORS_ORIGINS: "https://hekkidir.github.io"
