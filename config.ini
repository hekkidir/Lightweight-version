[data]
history_years    = 3
mcap_refresh_days = 7

[screener]
breadth_stages = 2A,2B

[stage_thresholds]
slope_threshold = 0.003
slope_window    = 20

rsi_2a_floor = 45
rsi_2b       = 60
rsi_2c       = 73
ext_2c       = 5.0

rsi_4a_ceil = 55
rsi_4b      = 38
rsi_4c      = 27
ext_4c      = -3.0

rsi_1b_floor = 40
rsi_3b_ceil  = 50

rvol_confirm = 1.1
rvol_window  = 21

# How many recent trading bars back a ticker's last bar may be and still appear.
# A ticker that misses today's live snapshot falls back to its last real bar
# within this window instead of vanishing; older (likely delisted) ones drop out.
max_stale_bars = 5

[download]
chunk_size = 25

# Self-healing backfill: after an incremental fetch, re-download any of the last
# backfill_lookback_days trading days whose ticker coverage falls below
# backfill_min_frac of the recent median (a throttled/partial download day).
# Scoped to the recent window so it never re-chases ancient, permanently-missing
# bars. Set backfill_lookback_days = 0 to disable.
backfill_lookback_days = 15
backfill_min_frac      = 0.97

[rotation]
window_position      = 20
window_momentum      = 5
tail_length          = 7
cohesion_window      = 30
cohesion_full        = 0.5
cohesion_min         = 0.3
min_tickers_cohesion = 12
ema_smooth           = 3
benchmark_weighting  = equal

[robots]
# Strategy-robot liquidity + score knobs (pipeline/robots.py candidate gates).
# liq_min_dv   = SA/SV floor on single-day dollar volume ($)
# liq_min_sb   = SB (D) floor on the dv_avg_win-day AVERAGE dollar volume ($)
# dv_avg_win   = trading-day window for the SB average-dollar-volume floor
# score_floor  = minimum SB dashboard score for a candidate to qualify (D)
# liq_min_sb_b / score_floor_b = B-GATE-W3 overrides (tuned separately from D via the
#   backtest_lab sweep: $20M floor is the U-shape optimum, score floor 3.0 lifts return).
liq_min_dv   = 50000000
liq_min_sb   = 30000000
dv_avg_win   = 7
score_floor  = 2.39
liq_min_sb_b = 20000000
score_floor_b = 3.0

# GICS-rotation windows (gics_panel): X = long-term "position" axis, Y = recent
# "momentum" axis, both in trading days. A window sweep (27 configs x 7 robots,
# split-half validated) found X=126 beats the old X=252 on 5 of 6 sector-gated
# robots in BOTH halves, with a slightly better drawdown; Y=20 is optimal and
# shortening it is strongly negative (Y=5 -> Sharpe 0.9). B-GATE-W3 is the one
# robot that prefers the longer X in both halves, so it keeps 252.
rot_x_window   = 126
rot_y_window   = 20

# Rotation benchmark per robot: "spy" (cap-weighted ETF) or "univ" (equal-weight
# mean of the universe's own sectors, as rotation.py/FORMULAS.md use). B-GATE-W3
# runs on "univ": split-half validated, it beat spy on return (x1.94), Sharpe
# (1.66 vs 1.49) AND drawdown (-44% vs -60%), winning both halves and 4 of 5
# years. The same test rejected "univ" for A-SCORE-CLUST (lost every second
# half), so every other robot stays on "spy".
rot_bench_b = univ

# How many days spy.parquet (the rotation benchmark) may lag prices.parquet
# before `run.py check` flags it. A stale benchmark silently degrades every
# sector's quadrant, so this is a hard failure, not a warning.
benchmark_max_lag_days = 7
